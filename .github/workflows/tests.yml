name: tests.yml
on:
  push:
    branches: [main]

jobs:
  run-test:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: installpython
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install dependencies
        run: pip install -r requirements_backup.txt

      - name: run tests
        run: pytest -v -s -m ui --html=report.html --self-contained-html

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: report.html
